[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "minor-project-coding-agent"
version = "1.0.0"
description = "A simple autonomous coding agent for a college minor project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.test-tmp"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
