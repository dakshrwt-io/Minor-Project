[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "minor-project-coding-agent"
version = "0.1.0"
description = "An auditable autonomous coding agent for a college minor project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50",
    "fastapi>=0.115",
    "langgraph>=0.3",
    "pydantic>=2.10",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.test-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
